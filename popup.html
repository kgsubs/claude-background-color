<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; width: 200px; color: #222; }
  label { display: block; margin-bottom: 8px; }
  input[type=color] { width: 100%; height: 40px; border: 1px solid #ccc; padding: 2px; cursor: pointer; }
  button { margin-top: 10px; width: 100%; padding: 6px; cursor: pointer; }
  #state { margin-top: 8px; color: #666; }
</style>
</head>
<body>
  <label for="pick">Background color</label>
  <input type="color" id="pick" value="#ffffff">
  <button id="reset">Use Claude's own color</button>
  <div id="state"></div>
  <script src="popup.js"></script>
</body>
</html>
